<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DeepWebMonitor{% endblock %} · {{ settings.company_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
  <header class="topbar no-print">
    <a class="brand" href="/">
      {% if settings.company_logo %}<img src="{{ url_for('static', path=settings.company_logo) }}" alt="">{% endif %}
      <span>{{ settings.company_name }}</span><small>DeepWebMonitor</small>
    </a>
  </header>
  <main class="container">
    {% if msg %}<div class="flash">{{ msg }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
