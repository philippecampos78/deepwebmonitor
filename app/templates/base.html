<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DeepWebMonitor{% endblock %} · {{ settings.company_name }}</title>
  <link rel="preload" href="{{ url_for('static', path='fonts/poppins-400.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
  <header class="topbar no-print">
    <div class="topbar-inner">
      <a class="brand" href="/">
        <img src="/marca/logo?fundo=escuro" alt="{{ settings.company_name }}"{% if logo_needs_filter() %} class="auto-white"{% endif %}>
        <span class="product">DeepWebMonitor</span>
      </a>
      <nav class="nav">
        <a href="/" class="{{ 'active' if active_nav == 'clientes' }}">Clientes</a>
        <a href="/senhas" class="{{ 'active' if active_nav == 'senhas' }}">Verificar senha</a>
      </nav>
    </div>
  </header>
  <main class="container">
    {% if msg %}<div class="flash no-print">{{ msg }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
